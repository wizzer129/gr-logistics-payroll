services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: gr_logistics
            POSTGRES_PASSWORD: dev_password
            POSTGRES_DB: gr_logistics
        ports:
            - '5432:5432'
        volumes:
            - gr_logistics_db:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U gr_logistics']
            interval: 5s
            timeout: 5s
            retries: 10

    # One-shot: applies pending migrations, then exits. The backend waits for it to succeed.
    migrate:
        build: ./backend
        image: gr-logistics-backend:dev
        pull_policy: build
        command: ['migrate']
        # Passed through from the host — run compose under `bunx --bun varlock run --` from the repo root (see README).
        environment:
            NODE_ENV:
            PORT:
            SESSION_TTL_HOURS:
            CORS_ORIGIN:
            ANTHROPIC_API_KEY:
            ANTHROPIC_BASE_URL:
            LOG_LEVEL:
            LOG_FORMAT:
            DATABASE_URL: postgres://gr_logistics:dev_password@db:5432/gr_logistics
        depends_on:
            db:
                condition: service_healthy

    backend:
        build: ./backend
        image: gr-logistics-backend:dev
        pull_policy: build
        # Passed through from the host — run compose under `bunx --bun varlock run --` from the repo root (see README).
        environment:
            NODE_ENV:
            PORT:
            SESSION_TTL_HOURS:
            CORS_ORIGIN:
            ANTHROPIC_API_KEY:
            ANTHROPIC_BASE_URL:
            LOG_LEVEL:
            LOG_FORMAT:
            DATABASE_URL: postgres://gr_logistics:dev_password@db:5432/gr_logistics
        ports:
            - '3000:3000'
        depends_on:
            db:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        # Uses the image's HEALTHCHECK (`gr-logistics healthcheck`).

volumes:
    gr_logistics_db:
