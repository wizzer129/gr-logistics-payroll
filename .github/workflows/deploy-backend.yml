name: Deploy backend

# Only when something the image is built from changed (or by hand from the Actions tab): the
# image build is the slowest thing in the pipeline.
on:
    push:
        branches: [main]
        paths:
            - 'backend/**'
            - '.github/workflows/deploy-backend.yml'
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}-backend

jobs:
    build-backend-image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            # The type=gha cache backend below needs this to read/write the Actions cache —
            # without it, buildx fails with "failed to solve: ... build-cache-backends".
            actions: write
        steps:
            - uses: actions/checkout@v4

            # The default `docker` driver can't export the type=gha cache below ("Cache export
            # is not supported for the docker driver") — buildx's docker-container driver can.
            - uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=sha
                      type=raw,value=latest

            - name: Build and push backend image
              uses: docker/build-push-action@v5
              with:
                  context: ./backend
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # Pulling and restarting the container on the user's own server is a
            # separate step — not yet wired up. Options: SSH into the server from
            # this job and run `docker compose pull && docker compose up -d`, or a
            # self-hosted runner, or a webhook the server polls. See PROJECT_PLAN.md.
