name: Deploy

on:
    push:
        branches: [main]

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}-backend

jobs:
    deploy-frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3
            - run: bun install
              working-directory: frontend
            - run: bun run build
              working-directory: frontend
            - uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy frontend/dist --project-name=gr-logistics

    build-backend-image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            # The type=gha cache backend below needs this to read/write the Actions cache —
            # without it, buildx fails with "failed to solve: ... build-cache-backends".
            actions: write
        steps:
            - uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=sha
                      type=raw,value=latest

            # Rust backend since the Phase 7 cutover (RUST_MIGRATION.md). Rollback: redeploy a
            # pre-cutover `sha-…` tag of this image — those are the Bun builds, and the
            # schema (through 0007) and session format work with both.
            - name: Build and push backend image
              uses: docker/build-push-action@v5
              with:
                  context: ./backend-rs
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # Pulling and restarting the container on the user's own server is a
            # separate step — not yet wired up. Options: SSH into the server from
            # this job and run `docker compose pull && docker compose up -d`, or a
            # self-hosted runner, or a webhook the server polls. See PROJECT_PLAN.md.
