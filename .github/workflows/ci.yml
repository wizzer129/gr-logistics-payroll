name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3
            - run: bun install
            - run: bun run lint

    backend-test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: gr_logistics
                    POSTGRES_PASSWORD: ci_password
                    POSTGRES_DB: gr_logistics
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U gr_logistics"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            NODE_ENV: test
            DATABASE_URL: postgres://gr_logistics:ci_password@localhost:5432/gr_logistics
            SESSION_SECRET: ci_secret
            SESSION_TTL_HOURS: 12
            ANTHROPIC_API_KEY: ci_placeholder
            LOG_LEVEL: ERROR
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3
            - run: bun install
              working-directory: backend
            - run: bun run migrate
              working-directory: backend
            - run: bun scripts/check-env-parity.ts
              working-directory: backend
            - run: bun test
              working-directory: backend

    frontend-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3
            - run: bun install
              working-directory: frontend
            - run: bun run test
              working-directory: frontend
            - run: bun run build
              working-directory: frontend

    e2e:
        runs-on: ubuntu-latest
        needs: [frontend-test]
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3
            - run: bun install
              working-directory: frontend
            - uses: cypress-io/github-action@v6
              with:
                  working-directory: frontend
                  start: bun run dev
                  wait-on: 'http://localhost:5173'
