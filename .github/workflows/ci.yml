name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3
            - run: bun install
            - run: bun run lint

    backend-test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: gr_logistics
                    POSTGRES_PASSWORD: ci_password
                    POSTGRES_DB: gr_logistics
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U gr_logistics"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            # #[sqlx::test] creates a throwaway database per test on this server.
            DATABASE_URL: postgres://gr_logistics:ci_password@localhost:5432/gr_logistics
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
            # Keep in sync with backend/rust-toolchain.toml.
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: '1.99'
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: backend
            - run: cargo fmt --check
            - run: cargo clippy --all-targets --locked -- -D warnings
            - run: cargo test --locked

    frontend-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3
            - run: bun install
              working-directory: frontend
            - run: bun run test
              working-directory: frontend
            - run: bun run build
              working-directory: frontend

    e2e:
        runs-on: ubuntu-latest
        needs: [frontend-test]
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3
            - run: bun install
              working-directory: frontend
            - run: bunx playwright install --with-deps chromium
              working-directory: frontend
            - run: bun run e2e
              working-directory: frontend
