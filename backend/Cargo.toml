[package]
name = "gr-logistics"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
garde = { version = "0.23.0", features = ["derive", "email"] }
getrandom = "0.4.3"
include_dir = "0.7.4"
minijinja = { version = "3.0.1", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-float", "serde-with-arbitrary-precision"] }
rust_decimal_macros = "1.40.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "rust_decimal", "json", "macros"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
typst = "0.15"
typst-as-lib = "0.17"
typst-layout = "0.15"
typst-pdf = "0.15"
uuid = { version = "1.28.0", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
# `#[sqlx::test]` needs the migrate feature even with `migrations = false`. Dev-only, so
# the release binary doesn't carry sqlx's migrator — we use our own (src/cli/migrate.rs).
sqlx = { version = "0.9.0", default-features = false, features = ["migrate"] }

# Debug info is most of what makes test binaries large and slow to link (Typst alone is
# hundreds of MB of it). Our code keeps line tables, so panics and backtraces still show
# file:line; dependencies get none (only matters for stepping into them in a debugger).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
